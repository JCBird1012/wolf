name: Build test image

# CI-only workflow for building a test image of this fork; not meant for upstream.
on:
  push:
    branches: [ci/test-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wolf" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Wolf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wolf.Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:lobby-fix
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=ghcr.io/games-on-whales/gstreamer:1.26.7
            NINJA_JOBS=2
          cache-from: |
            type=registry,ref=${{ steps.img.outputs.name }}:buildcache
            type=registry,ref=ghcr.io/games-on-whales/wolf:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max
